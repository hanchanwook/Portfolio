# Local MySQL connection. Run the backend from the backend directory.
# Public key retrieval is enabled only for this localhost development connection.
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=portfolio_app
# Replace the value below with the password used in CREATE USER.
spring.datasource.password=1111
# Read-only access until ADMIN_API_KEY is configured (32+ random characters).
portfolio.admin-key=${ADMIN_API_KEY:}
